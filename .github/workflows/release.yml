name: Windows 앱 빌드·릴리즈 (쌤비서)

# 릴리즈를 만들거나 v로 시작하는 태그(v1.0.0 등)를 올리면 exe를 만들어 릴리즈에 붙임
# Actions 탭에서 직접 실행할 때 「릴리즈 만들기」를 켜면 package.json 버전으로 릴리즈까지 만듦
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: '릴리즈 만들기 (package.json 버전으로 태그를 만들고 exe를 올림)'
        type: boolean
        default: false

permissions:
  contents: write

# 릴리즈를 만들면 태그 이벤트와 릴리즈 이벤트가 함께 오므로 한 번만 돌게 함
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 패키지 설치
        run: npm ci

      - name: 앱 빌드 (설치 파일 + 실행 파일)
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          NO_COLOR: '1'
        run: |
          set -o pipefail
          if ! npm run tauri build -- --bundles nsis 2>&1 | tee build.log; then
            # 실패하면 마지막 로그를 Actions 화면 위쪽에 바로 보이게 남김
            tail -n 80 build.log | sed 's/\x1b\[[0-9;]*m//g; s/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' > tail.txt
            echo "::error title=빌드 실패::$(cat tail.txt)"
            exit 1
          fi

      # 자동 업데이트·AI 대신 보내기 등 Rust 시험 (빌드 뒤라 dist/가 있음)
      - name: Rust 시험
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: 파일 이름 정리
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName "out/ssam-$v-setup.exe"
          Copy-Item src-tauri/target/release/ssam.exe "out/ssam-$v-portable.exe"

          # 확인값(SHA-256) 목록
          Get-ChildItem out/*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content out/SHA256SUMS.txt -Encoding ascii

          # 앱이 새 버전을 확인할 때 읽는 파일 (바뀐 점은 RELEASE_NOTES.md의 whats-new 주석 사이 내용)
          $all = Get-Content .github/RELEASE_NOTES.md -Raw -Encoding utf8
          $m = [regex]::Match($all, '(?s)<!-- whats-new -->(.*?)<!-- /whats-new -->')
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { '' }
          $files = @{}
          foreach ($kind in 'setup', 'portable') {
            $f = Get-Item "out/ssam-$v-$kind.exe"
            $files[$kind] = [ordered]@{
              name   = $f.Name
              sha256 = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
              size   = $f.Length
            }
          }
          [ordered]@{
            version   = $v
            notes     = $notes
            published = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            setup     = $files['setup']
            portable  = $files['portable']
          } | ConvertTo-Json -Depth 4 | Set-Content out/latest.json -Encoding utf8

          Get-ChildItem out | Format-Table Name, Length
          Get-Content out/SHA256SUMS.txt
          Get-Content out/latest.json -Encoding utf8

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v6
        with:
          name: ssam-windows
          path: out/*

      - name: 릴리즈에 올리기
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$v" }
          # 설명 파일의 {version}을 실제 버전으로 바꿈
          (Get-Content .github/RELEASE_NOTES.md -Raw -Encoding utf8).Replace('{version}', $v) | Set-Content notes.md -Encoding utf8
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "쌤비서 $tag" --notes-file notes.md
          } else {
            # 설명을 비워 두고 만든 릴리즈라면 준비된 설명을 채움
            $body = gh release view $tag --json body --jq .body
            if (-not $body) { gh release edit $tag --notes-file notes.md }
          }
          gh release upload $tag (Get-ChildItem out/*).FullName --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "릴리즈: https://github.com/${{ github.repository }}/releases/tag/$tag"
